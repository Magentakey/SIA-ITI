          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              courseId: crs_00000000-0000-4000-8000-000000000001
              startTime: '2026-12-01T01:00:00Z'
              endTime: '2026-12-01T03:30:00Z'
              scheduleId: sch_001
              topic: Pengenalan Arsitektur Perangkat Lunak
              attendanceMethod: BOTH
  /meetings/{meetingId}/attendance:
    patch:
      summary: Atur pintu absensi (buka/tutup, metode QR|BUTTON|BOTH)
      description: 'Role: LECTURER (pengampu)'
      tags:
