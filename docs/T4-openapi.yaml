openapi: 3.0.3
info:
  title: SIA ITI - API Presensi (Tim 4)
  version: 1.0.0
  description: 'Kontrak API modul Presensi. Envelope: success, code, message, data, meta (sukses) dan success, code, message, error{type,code,details} (gagal). Waktu ISO 8601 UTC.'
servers:
- url: http://localhost:8000/api/v1
  description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Success:
      type: object
      required:
      - success
      - code
      - message
      - data
      - meta
      properties:
        success:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          nullable: true
        meta:
          nullable: true
          type: object
    Error:
      type: object
      required:
      - success
      - code
      - message
      - error
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          example: 422
        message:
          type: string
        error:
          type: object
          required:
          - type
          - code
          - details
          properties:
            type:
              type: string
              example: BUSINESS_RULE_VIOLATION
            code:
              type: string
              example: QR_EXPIRED
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    Meeting:
      type: object
      properties:
        meetingId:
          type: string
        courseId:
          type: string
        scheduleId:
          type: string
          nullable: true
        meetingNumber:
          type: integer
        topic:
          type: string
          nullable: true
        lecturerId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - ENDED
        attendanceOpen:
          type: boolean
        attendanceMethod:
          type: string
          enum:
          - QR
          - BUTTON
          - BOTH
    LecturerAttendance:
      type: object
      properties:
        lecturerAttendanceId:
          type: string
        meetingId:
          type: string
        lecturerId:
          type: string
        isPresentAtStart:
          type: boolean
        isPresentAtEnd:
          type: boolean
        isPresent:
          type: boolean
          description: 'Turunan: start AND end. Tidak bisa diubah langsung.'
        reminderSent:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
    Attendance:
      type: object
      properties:
        attendanceId:
          type: string
        meetingId:
          type: string
        studentId:
          type: string
        status:
          type: string
          enum:
          - ATTENDED
          - SICK
          - ABSENT
          - PERMISSION
        method:
          type: string
          enum:
          - QR
          - BUTTON
          - MANUAL
        timestamp:
          type: string
          format: date-time
        confirmedBy:
          type: string
          nullable: true
    RecapRow:
      type: object
      properties:
        totalSessions:
          type: integer
        attendedDetail:
          type: object
          properties:
            attendedSessions:
              type: integer
            sickSessions:
              type: integer
            absentSessions:
              type: integer
            permissionSessions:
              type: integer
        totalPercentage:
          type: number
        isEligibleForExam:
          type: boolean
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login (stand-in Auth Tim 1, hanya untuk pengujian)
      description: 'Role: Publik (stand-in Tim 1)'
      tags:
      - Auth (stand-in)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              username: DSN001
              password: <T4_DEV_PASSWORD>
  /meetings:
    post:
      summary: Buat Meeting baru
      description: 'Role: LECTURER'
      tags:
      - Presensi (T4)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Bad Request
